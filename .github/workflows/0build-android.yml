
name: Build Ape Tag Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          curl -L -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"

          GODOT_BIN=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.3*' | head -n 1)

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -L -o "$RUNNER_TEMP/godot/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"

          cp -a "$RUNNER_TEMP/godot/templates/templates/." \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android signing
        run: |
          mkdir -p "$HOME/.android"
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [resource]
          resource_name = "EditorSettings"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and build Ape Tag
        run: |
          mkdir -p build

          "$GODOT_BIN" --headless --editor --path . --quit

          "$GODOT_BIN" --headless --path . \
            --export-debug "Android (phone APK)" build/ApeTag.apk

          test -s build/ApeTag.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeTag-Android-APK
          path: build/ApeTag.apk
          if-no-files-found: error
          
