
name: Build Ape Tag Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Ape Tag
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/godot"

          curl -fL -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q "$RUNNER_TEMP/godot/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_BIN=$(find "$RUNNER_TEMP/godot" \
            -maxdepth 1 -type f -name 'Godot_v4.3*' | head -n 1)

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot Android templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p "$RUNNER_TEMP/templates"

          curl -fL -o "$RUNNER_TEMP/templates/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q "$RUNNER_TEMP/templates/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          cp -a "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"

      - name: Configure Android
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Check project and export preset
        shell: bash
        run: |
          set -e

          echo "Checking project.godot..."
          test -f project.godot

          echo "Checking export_presets.cfg..."
          test -f export_presets.cfg

          echo "Available export presets:"
          cat export_presets.cfg

          echo "Checking Godot templates..."
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit \
            --verbose

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          echo "Starting Android export..."

          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android (phone APK)" \
            build/ApeTag.apk 2>&1 | tee build/export.log

          test -s build/ApeTag.apk

          echo "APK export successful!"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ApeTag-Android-APK
          path: build/ApeTag.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ApeTag-Build-Logs
          path: build/export.log
          if-no-files-found: ignore
          
