
name: Build Ape Tag Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Download Ape Tag project
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/godot"

          curl -fL -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"

          GODOT_BIN=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.3*' | head -n 1)

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p "$RUNNER_TEMP/templates"

          curl -fL -o "$RUNNER_TEMP/templates/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q "$RUNNER_TEMP/templates/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          cp -a "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"

      - name: Configure Android signing and Godot
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Ape Tag project
        shell: bash
        run: |
          set -e
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e

          mkdir -p build

          "$GODOT_BIN" --headless --path . \
            --export-debug "Android (phone APK)" \
            build/ApeTag.apk

          test -s build/ApeTag.apk

          echo "APK successfully created!"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeTag-Android-APK
          path: build/ApeTag.apk
          if-no-files-found: error
          retention-days: 14
          
